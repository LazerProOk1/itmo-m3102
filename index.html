<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- SomaFM не отдаёт поток, если в запросе Referer чужого сайта (радио-капсула); заодно приватнее для внешних ссылок -->
    <meta name="referrer" content="no-referrer" />
    <title>М3102 — учебное пространство</title>
    <script>
      // Применяем сохранённую тему ДО загрузки React,
      // чтобы страница не «мигала» светлой темой при открытии.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('m3102:settings') || '{}');
          var theme = saved.state && saved.state.theme;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
