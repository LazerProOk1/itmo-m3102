<!DOCTYPE html>
    <html lang="ru">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>M3102</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <style>
    :root{--bg:#f4f5fa;--card:#ffffff;--text:#1a1c24;--muted:#6b7280;--border:#e6e7ee;--accent:#5b5fef;--accent2:#7c7ffb;--radius:16px;}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1016;--card:#1a1c26;--text:#eef0f7;--muted:#9599ab;--border:#2b2e3c;}}
    :root[data-theme="dark"]{--bg:#0f1016;--card:#1a1c26;--text:#eef0f7;--muted:#9599ab;--border:#2b2e3c;}
    *{box-sizing:border-box;}
    html{scroll-padding-top:env(safe-area-inset-top,0px);}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
    .wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px;}
    header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
    .brand{font-weight:700;font-size:1.05rem;text-decoration:none;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:10px;}
    .brand-logo{height:34px;width:auto;display:block;}
    .navlinks{display:flex;gap:14px;}
    .navlinks a{color:var(--muted);font-size:.82rem;text-decoration:none;}
    .navlinks a:hover{color:var(--accent);}
    .deadline-card{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card));}
    .deadline-card:hover{border-color:var(--accent2);}
    .intro{margin:14px 0 6px;}
    h1{font-size:1.7rem;margin:0 0 6px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
    .sub{color:var(--muted);font-size:.95rem;max-width:600px;margin:0 0 18px;}
    .crumbs{font-size:.85rem;color:var(--muted);margin:10px 0 16px;}
    .crumbs a{color:var(--muted);text-decoration:none;cursor:pointer;}
    .crumbs a:hover{color:var(--accent);}
    .grid{display:grid;gap:14px;grid-template-columns:1fr;}
    @media(min-width:600px){.grid{grid-template-columns:1fr 1fr;}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:var(--text);}
    .card:hover{border-color:var(--accent);}
    .card .ic{font-size:1.6rem;line-height:1;}
    .card .meta{min-width:0;flex:1;}
    .card .name{font-weight:600;font-size:.95rem;word-break:break-word;}
    .card .desc{color:var(--muted);font-size:.78rem;margin-top:2px;}
    .card .btn{border:1px solid var(--border);background:var(--bg);padding:6px 12px;border-radius:8px;font-size:.78rem;white-space:nowrap;text-decoration:none;color:var(--text);}
    .card .btn:hover{border-color:var(--accent);}
    .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--border);}
    .nick-link{color:var(--muted);font-size:.78rem;text-decoration:none;}
    .nick-link:hover{color:var(--accent);}
    .fact-pill{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,var(--card));color:var(--accent);font-size:.72rem;font-weight:600;}
    .role-pill{display:inline-block;margin-top:4px;margin-left:6px;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,#22c55e 15%,var(--card));color:#1a9c4a;font-size:.72rem;font-weight:600;}
    .state{color:var(--muted);font-size:.9rem;padding:20px 0;}
    .students-grid{display:grid;gap:20px;grid-template-columns:1fr;}
    @media(min-width:600px){.students-grid{grid-template-columns:1fr 1fr;}}
    @media(min-width:980px){.students-grid{grid-template-columns:1fr 1fr 1fr;}}
    .student-card{position:relative;overflow:hidden;padding:0;display:block;align-items:initial;gap:0;aspect-ratio:3/4;background:var(--card);}
    .student-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:brightness(.62) saturate(1.05);transition:filter .2s,transform .3s;background:var(--border);}
    .student-card:hover .student-photo{filter:brightness(.5) saturate(1.05);transform:scale(1.03);}
    .student-overlay{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:16px 16px 14px;background:linear-gradient(180deg,rgba(10,10,14,0) 0%,rgba(10,10,14,.55) 35%,rgba(10,10,14,.86) 100%);}
    .student-overlay .name{color:#fff;font-size:1.02rem;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4);}
    .student-overlay .nick-link{color:rgba(255,255,255,.75);}
    .student-overlay .nick-link:hover{color:#fff;}
    .student-overlay .fact-pill{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(3px);}
    .student-overlay .role-pill{background:rgba(34,197,94,.35);color:#fff;backdrop-filter:blur(3px);}
    .student-card .btn{position:absolute;top:12px;right:12px;z-index:1;background:rgba(20,20,26,.55);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(3px);}
    .student-card .btn:hover{border-color:#fff;background:rgba(20,20,26,.75);}
    .viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
    .btn2{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;font-size:.85rem;cursor:pointer;text-decoration:none;}
    .btn2:hover{border-color:var(--accent);}
    .viewname{font-weight:600;flex:1;min-width:0;word-break:break-word;}
    .pdf-page{display:block;margin:0 auto 14px;max-width:100%;height:auto;box-shadow:0 2px 14px rgba(0,0,0,.18);border-radius:4px;}
    footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:30px;}
    .prose{max-width:760px;margin:0 auto;line-height:1.7;font-size:.98rem;}
    .prose h1,.prose h2,.prose h3{line-height:1.3;margin:1.3em 0 .5em;}
    .prose h1{font-size:1.5rem;}.prose h2{font-size:1.25rem;}.prose h3{font-size:1.08rem;}
    .prose p{margin:.7em 0;}
    .prose ul,.prose ol{padding-left:1.4em;margin:.6em 0;}
    .prose blockquote{border-left:3px solid var(--border);margin:.8em 0;padding:.2em 1em;color:var(--muted);}
    .prose table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.9rem;display:block;overflow-x:auto;}
    .prose th,.prose td{border:1px solid var(--border);padding:6px 10px;text-align:left;}
    .prose img{max-width:100%;border-radius:8px;}
    .prose pre{position:relative;background:#1e1f29;border-radius:10px;padding:14px;overflow-x:auto;margin:1em 0;}
    .prose code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.85em;}
    .prose :not(pre)>code{background:var(--border);padding:1px 5px;border-radius:5px;}
    .prose .code-copy{position:absolute;top:8px;right:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#d7d9e2;font-size:.72rem;padding:4px 9px;border-radius:6px;cursor:pointer;opacity:0;transition:opacity .15s;}
    .prose pre:hover .code-copy{opacity:1;}
    .prose .code-copy.copied{opacity:1;border-color:#22c55e;color:#22c55e;}
    .prose .mermaid{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin:1em 0;overflow-x:auto;text-align:center;}
    .prose .mermaid-err{color:#e0485c;font-family:monospace;font-size:.85em;white-space:pre-wrap;background:rgba(224,72,92,.08);border-radius:8px;padding:10px 12px;}
    .prose h1[id],.prose h2[id],.prose h3[id]{scroll-margin-top:14px;}
    .prose .heading-anchor{opacity:0;margin-left:.35em;color:var(--muted);text-decoration:none;font-size:.85em;}
    .prose h1:hover .heading-anchor,.prose h2:hover .heading-anchor,.prose h3:hover .heading-anchor{opacity:1;}
    .prose .img-figure{margin:1em 0;text-align:center;}
    .prose .img-figure img{cursor:zoom-in;}
    .prose .img-figure figcaption{color:var(--muted);font-size:.82rem;margin-top:6px;}
    .img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000;cursor:zoom-out;}
    .img-lightbox img{max-width:100%;max-height:100%;border-radius:6px;}
    .prose .katex-display{overflow-x:auto;overflow-y:hidden;padding:.3em 0;}
    .prose .katex-err{color:#e0485c;font-family:monospace;}
    .prose hr{border:none;border-top:1px solid var(--border);margin:1.5em 0;}
    .callout{border-left:4px solid var(--c-color);background:var(--c-bg);border-radius:10px;padding:12px 16px;margin:14px 0;}
    .callout-title{font-weight:700;font-size:.76rem;margin-bottom:6px;color:var(--c-color);text-transform:uppercase;letter-spacing:.03em;}
    .callout-body{font-size:.93rem;}
    .callout-body>:first-child{margin-top:0;}
    .callout-body>:last-child{margin-bottom:0;}

    /* header tabs */
    .tabs{display:flex;gap:2px;flex-wrap:wrap;}
    .tab{padding:7px 12px;border-radius:10px;font-size:.83rem;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap;}
    .tab:hover{color:var(--text);background:var(--border);}
    .tab.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));font-weight:600;}

    /* home landing page */
    .home-hero{padding:6px 0 4px;}
    .home-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;}
    .home-actions .btn2{padding:14px 22px;font-size:1rem;border-radius:12px;}
    .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
    .btn-primary:hover{background:var(--accent2);border-color:var(--accent2);}
    .home-grid{display:grid;gap:20px;grid-template-columns:1fr;margin-top:24px;align-items:start;}
    @media(min-width:760px){.home-grid{grid-template-columns:1fr 300px;}}
    .home-side{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
    .side-title{font-size:.95rem;margin:0 0 12px;}
    .recent-item{display:block;padding:10px 0;border-bottom:1px solid var(--border);text-decoration:none;color:var(--text);}
    .recent-item:last-child{border-bottom:none;}
    .recent-item:hover .recent-name{color:var(--accent);}
    .recent-name{font-weight:600;font-size:.88rem;word-break:break-word;}
    .recent-meta{color:var(--muted);font-size:.76rem;margin-top:2px;}

    /* schedule */
    .sched-bar{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px;}
    .week-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
    .week-pill{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:6px 10px;font-size:.78rem;cursor:pointer;text-align:center;line-height:1.3;}
    .week-pill.today{border-color:var(--accent);}
    .week-pill.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
    .sched-day-info{text-align:center;margin:14px 0 20px;}
    .sched-day-title{font-weight:700;font-size:1.05rem;}
    .sched-day-sub{color:var(--muted);font-size:.85rem;margin-top:2px;}
    .lessons{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto;}
    .lesson{display:flex;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;}
    .lesson-time{font-weight:700;font-size:.85rem;color:var(--accent);min-width:92px;}
    .lesson-subject{font-weight:600;font-size:.92rem;}
    .lesson-meta{color:var(--muted);font-size:.78rem;margin-top:2px;}
    .lesson-break{opacity:.65;}
    .print-logo{display:none;}
     @media print{
      @page{margin:1mm 1mm 1mm 1mm;}
      :root{--bg:#fff;--card:#fff;--text:#111;--muted:#555;--border:#ccc;}
      header,footer,.tabs,.navlinks,.crumbs,.sched-alert,.viewbar{display:none !important;}
      body{padding:0;background:#fff;}
      .wrap{max-width:100%;padding:0;margin:0;}
      .prose{
        max-width:100%;margin:0;font-size:12pt;line-height:1.5;color:#111;
        padding-bottom:22mm;
        background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><text x="0" y="150" font-size="28" font-family="Arial, sans-serif" fill="rgba(0,0,0,0.08)" transform="rotate(-30 150 150)">M3102</text></svg>');
        background-repeat:repeat;
      }
      .prose pre{background:#f2f2f2 !important;color:#111 !important;border:1px solid #ddd;}
      .prose .mermaid{background:#fff !important;}
      .prose a{color:#111 !important;text-decoration:underline;}
      .prose img{max-width:100% !important;}
      .callout{break-inside:avoid;}
      .prose h1,.prose h2,.prose h3{break-after:avoid;}
      .print-logo{
        display:block;
        position:fixed;
        left:8mm;
        bottom:2mm;
        width:18mm;
        max-height:18mm;
        z-index:9999;
      }
      .print-logo img{width:100%;height:auto;max-height:18mm;object-fit:contain;display:block;}
    }
    /* ---------- страница «Дедлайны» ---------- */
    .dl-page{--dl-ok:#16a34a;--dl-warn:#d97706;--dl-danger:#e0485c;}
    .dl-overview{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:20px 22px;margin:4px 0 22px;border:1px solid var(--border);border-radius:var(--radius);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 13%,var(--card)) 0%,var(--card) 65%);}
    .dl-stat{display:flex;flex-direction:column;gap:4px;min-width:150px;}
    .dl-stat-label{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
    .dl-stat strong{font-size:2.3rem;line-height:1;font-weight:800;color:var(--text);}
    .dl-stat strong small{font-size:.95rem;font-weight:500;color:var(--muted);}
    .dl-late-chip{align-self:flex-start;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700;color:var(--dl-danger);background:color-mix(in srgb,var(--dl-danger) 13%,var(--card));}
    .dl-progress{flex:1;min-width:200px;}
    .dl-progress-meta{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;margin-bottom:8px;}
    .dl-progress-bar{height:9px;border-radius:999px;background:var(--border);overflow:hidden;}
    .dl-progress-bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .45s ease;}
    .dl-progress p{margin:10px 0 0;font-size:.78rem;color:var(--muted);}
    .dl-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));align-items:stretch;}
    .dl-card{--tone:var(--accent);position:relative;display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px 22px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:default;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
    .dl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tone);}
    .dl-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(30,30,60,.10);border-color:color-mix(in srgb,var(--tone) 45%,var(--border));}
    .dl-card[data-state="ok"]{--tone:var(--dl-ok);}
    .dl-card[data-state="soon"]{--tone:var(--dl-warn);}
    .dl-card[data-state="urgent"],.dl-card[data-state="late"]{--tone:var(--dl-danger);}
    .dl-card[data-state="done"]{--tone:var(--muted);}
    .dl-card[data-state="done"] .dl-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;}
    .dl-card[data-state="done"]>:not(.dl-top):not(.dl-done){opacity:.6;}
    .dl-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .dl-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.74rem;font-weight:700;color:var(--tone);background:color-mix(in srgb,var(--tone) 14%,var(--card));}
    .dl-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
    .dl-card[data-state="urgent"] .dl-pill::before{animation:dl-pulse 1.4s ease-in-out infinite;}
    @keyframes dl-pulse{50%{opacity:.25;}}
    .dl-title{margin:2px 0 0;font-size:1.12rem;line-height:1.3;word-break:break-word;}
    .dl-date{font-size:.86rem;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}
    .dl-note{font-size:.8rem;color:var(--muted);margin-top:-4px;}
    .dl-queue-block{margin-top:4px;padding-top:12px;border-top:1px dashed var(--border);flex:1;}
    .dl-queue-head{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    .dl-count{text-transform:none;letter-spacing:0;padding:1px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--border);font-weight:600;}
    .dl-queue{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:172px;overflow-y:auto;}
    .dl-queue li{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;border-radius:10px;background:var(--bg);font-size:.85rem;}
    .dl-queue a{color:var(--text);text-decoration:none;min-width:0;word-break:break-word;}
    .dl-queue a:hover{color:var(--accent);}
    .dl-pos{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:.7rem;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card));}
    .dl-empty{margin:0;font-size:.82rem;color:var(--muted);}
    .dl-join{display:flex;gap:8px;flex-wrap:wrap;}
    .dl-input{flex:1;min-width:120px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:.85rem;}
    .dl-input:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent);}
    .dl-join .btn2{white-space:nowrap;}
    .dl-done{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);cursor:pointer;user-select:none;}
    .dl-done input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}
    .deadline-row.is-late .deadline-status{color:#e0485c;font-weight:700;}
    @media (prefers-reduced-motion:reduce){.dl-card,.dl-progress-bar span{transition:none;}.dl-pill::before{animation:none !important;}}
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script type="module">
    import { dateKey, parseDate, isVacation, lessonsOn, weekParity } from './js/schedule.js';
    import { mountSchedule, ensureSchedule, getSchedule } from './js/schedule-ui.js';
    import { installScheduleEditor } from './js/schedule-editor.js';

    import { printifyDiagrams } from './js/diagrams/array-player.js';
    import { pickGreeting } from './js/greetings.js';
    import { bindNoteDiagrams, installDiagramEditor, renderDiagramEditor } from './js/diagrams/editor.js';
    import { installMemes, renderMemesPage } from './js/memes.js';
    import { renderLinksPage, materialsSwitch } from './js/links.js';
    import { quizFigure, bindQuizzes, quizPageSource, mountQuizPage } from './js/quiz.js';
    import { mountSidebar, mountSiteSearch, stripFrontMatter, loadDisplayNames, prettyName, findMoved, byLecture } from './js/lectures.js';
    const OWNER='RedstoneLord', REPO='itmo-m3102', BRANCH='master';
    const SUBTITLES={
      'Записи лекций':'Аудиозаписи лекций',
      'Конспекты':'Конспекты лекций и практик по предметам',
      'Лабораторные':'Лабораторные работы и отчёты по ним',
      'Материалы':'Учебники и вспомогательные материалы'
    };
    const EXT_ICON={pdf:'PDF',docx:'DOC',doc:'DOC',md:'MD',html:'WEB',htm:'WEB',mp3:'MP3',wav:'WAV',djvu:'DJVU',txt:'TXT'};

    function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    // Файлы и папки, которые не должны отображаться при просмотре материалов
    const HIDDEN_FILE_NAMES=['site.css','package.json','readme.md','.gitignore'];
    const HIDDEN_FOLDER_NAMES=['tests','inner','data','js','css','docs','img','tools', '.github'];
    function isHiddenPath(path){
      if(!path)return false;
      const parts=path.split('/');
      const base=parts[parts.length-1];
      if(HIDDEN_FILE_NAMES.includes(base.toLowerCase()))return true;
      return parts.some(p=>HIDDEN_FOLDER_NAMES.includes(p.toLowerCase()));
    }
    function ext(name){const i=name.lastIndexOf('.');return i<0?'':name.slice(i+1).toLowerCase();}
    function fmtSize(b){if(b<1024)return b+' Б';if(b<1048576)return (b/1024).toFixed(0)+' КБ';return (b/1048576).toFixed(1)+' МБ';}
    function encodePath(p){return p?p.split('/').map(encodeURIComponent).join('/'):'';}
    function decodePath(p){return p?p.split('/').map(decodeURIComponent).join('/'):'';}
    function apiUrl(path){const p=encodePath(path);return `https://api.github.com/repos/${OWNER}/${REPO}/contents${p?'/'+p:''}?ref=${BRANCH}`;}
    function rawUrl(path){return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodePath(path)}`;}
    function goto(path){location.hash=path?'#/'+encodePath(path):'#/materials';}
    function gotoView(path){location.hash='#/view/'+encodePath(path);}
    function gotoNote(path){location.hash='#/note/'+encodePath(path);}
    function gotoHomePage(){if(location.hash===''||location.hash==='#')route();else location.hash='';}
    document.getElementById('home-link').onclick=e=>{e.preventDefault();gotoHomePage();};
    document.getElementById('tab-home').onclick=e=>{e.preventDefault();gotoHomePage();};
    document.getElementById('tab-materials').onclick=e=>{e.preventDefault();location.hash='#/materials';};
    document.getElementById('tab-schedule').onclick=e=>{e.preventDefault();location.hash='#/schedule';};

    /* ---------- notes parser (markdown + callouts + code + LaTeX) ---------- */
    const CALLOUT_TYPES={
      remember:{color:'#e0485c',bg:'rgba(224,72,92,.08)',icon:'🔴',label:'Запомнить'},
      note:{color:'#dd9a2b',bg:'rgba(221,154,43,.08)',icon:'🟡',label:'Заметка'},
      meaning:{color:'#3b82f6',bg:'rgba(59,130,246,.08)',icon:'🔵',label:'Определение'},
      warning:{color:'#f97316',bg:'rgba(249,115,22,.08)',icon:'🟠',label:'Важно'},
      example:{color:'#22c55e',bg:'rgba(34,197,94,.08)',icon:'🟢',label:'Пример'},
      formula:{color:'#a855f7',bg:'rgba(168,85,247,.08)',icon:'🟣',label:'Формула'}
    };
    const CALLOUT_ALIASES={remember:'remember',запомнить:'remember',note:'note',заметка:'note',meaning:'meaning',определение:'meaning',warning:'warning',важно:'warning',внимание:'warning',example:'example',пример:'example',formula:'formula',формула:'formula'};
    function resolveCalloutType(raw){return CALLOUT_ALIASES[String(raw).toLowerCase()]||'note';}

    const calloutExtension={
      name:'callout', level:'block',
      start(src){const m=/(^|\n):::\S+/.exec(src);return m?m.index+(m[1]?1:0):undefined;},
      tokenizer(src){
        const rule=/^:::(\S+)[ \t]*\n([\s\S]*?)\n:::[ \t]*(?:\n|$)/;
        const m=rule.exec(src);
        if(m){
          const token={type:'callout',raw:m[0],calloutType:m[1],text:m[2],tokens:[]};
          this.lexer.blockTokens(token.text,token.tokens);
          return token;
        }
      },
      renderer(token){
        const type=resolveCalloutType(token.calloutType), cfg=CALLOUT_TYPES[type];
        return `<div class="callout" style="--c-color:${cfg.color};--c-bg:${cfg.bg};"><div class="callout-title">${cfg.icon} ${cfg.label}</div><div class="callout-body">${this.parser.parse(token.tokens)}</div></div>\n`;
      }
    };
    // ---- вспомогательные функции: подсветка кода, диаграммы, изображения ----
    let mermaidSeq=0;
    function renderMermaidBlock(code){
      const id='mermaid-'+(++mermaidSeq);
      // сам рендеринг SVG выполняется асинхронно после вставки в DOM (см. runMermaid);
      // исходный код диаграммы дублируем в data-атрибут, чтобы позже (при экспорте в PDF)
      // можно было перерендерить её заново в светлой теме, даже если на странице сейчас тёмная
      return `<div class="mermaid" data-mermaid-id="${id}" data-mermaid-src="${esc(code)}">${esc(code)}</div>`;
    }
    function highlightCode(code,lang){
      let out;
      try{out=(lang&&hljs.getLanguage(lang))?hljs.highlight(code,{language:lang}).value:hljs.highlightAuto(code).value;}
      catch(e){out=esc(code);}
      const langAttr=lang?` data-lang="${esc(lang)}"`:'';
      return `<pre><button class="code-copy" type="button" data-copy>Копировать</button><code class="hljs"${langAttr}>${out}</code></pre>`;
    }
    function renderCodeBlock(code,infostring){
      const lang=(infostring||'').trim().split(/\s+/)[0].toLowerCase();
      if(lang==='quiz')return `<div class="quiz-block" data-pdf-hide>${quizFigure(code)}</div>`; // data-pdf-hide: тесты не попадают в PDF
      if(lang==='mermaid')return renderMermaidBlock(code);
      if(hasDiagram(lang))return codeFigure(lang,code);
      return highlightCode(code,lang);
    }

    // Разрешаем относительные пути картинок/ссылок внутри конспекта относительно его расположения в репозитории
    let notesBasePath='';
    function resolveNotePath(url,basePath){
      if(!url)return url;
      if(/^[a-z][a-z0-9+.-]*:/i.test(url)||url.startsWith('//')||url.startsWith('#'))return null;
      if(url.startsWith('/'))return decodeURIComponent(url.replace(/^\/+/,''));
      const dir=basePath.includes('/')?basePath.slice(0,basePath.lastIndexOf('/')):'';
      const combined=(dir?dir+'/':'')+url;
      const parts=[];
      combined.split('/').forEach(seg=>{
        if(seg==='..')parts.pop();
        else if(seg!=='.'&&seg!=='')parts.push(seg);
      });
      return decodeURIComponent(parts.join('/'));
    }

    marked.use({
      gfm:true, breaks:false,
      extensions:[calloutExtension],
      renderer:{
        code(code,infostring){
          return renderCodeBlock(code,infostring);
        },
        heading(text,level,raw){
          const slug=String(raw||text).toLowerCase().trim()
            .replace(/[^\p{L}\p{N}\s-]/gu,'').replace(/\s+/g,'-');
          return `<h${level} id="${esc(slug)}">${text}<a class="heading-anchor" href="#${esc(slug)}" aria-hidden="true">#</a></h${level}>\n`;
        },
        html(html){return esc(html);},
        image(href,title,text){
          const resolved=resolveNotePath(href,notesBasePath);
          const src=resolved?rawUrl(resolved):/^https?:\/\//i.test(href)?href:'';
          if(!src)return esc(text||'');
          const cap=title||text;
          return `<figure class="img-figure"><img src="${esc(src)}" alt="${esc(text||'')}" loading="lazy" data-lightbox="${esc(src)}">${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`;
        },
        link(href,title,text){
          const resolved=resolveNotePath(href,notesBasePath);
          if(resolved){
            if(/\.md$/i.test(resolved))return `<a href="#/note/${encodePath(resolved)}" title="${esc(title||'')}">${text}</a>`;
            return `<a href="${esc(rawUrl(resolved))}" target="_blank" rel="noopener" title="${esc(title||'')}">${text}</a>`;
          }
          if(!/^https?:\/\//i.test(href))return text;
          return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(title||'')}">${text}</a>`;
        }
      }
    });

    function renderNotes(raw, basePath) {
      notesBasePath = basePath || '';
      const codeStore = [];

      // Сначала защищаем fenced code (поддержаны ``` и ~~~, с указанием языка)
      let text = raw.replace(/^([ \t]*)(`{3,}|~{3,})([^\n`~]*)\n([\s\S]*?)\n\1\2[ \t]*$/gm, (m, indent, fence, info, code) => {
        codeStore.push(renderCodeBlock(code, info));
        return `@@CODE_${codeStore.length - 1}@@`;
      });

      const mathStore = [];

      function stash(src, display) {
        mathStore.push({ src, display });
        return `@@MATH_${mathStore.length - 1}@@`;
      }

      // Защищаем математику от Markdown-парсера
      text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, g) =>
        stash(g.trim(), true)
      );

      text = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, g) =>
        stash(g.trim(), true)
      );

      text = text.replace(/\\\(([\s\S]+?)\\\)/g, (_, g) =>
        stash(g.trim(), false)
      );

      text = text.replace(/\$([^\$\n]+?)\$/g, (_, g) =>
        stash(g.trim(), false)
      );

      // Теперь Markdown
      let html = marked.parse(text);

      // Возвращаем формулы
      html = html.replace(/@@MATH_(\d+)@@/g, (_, i) => {
        const { src, display } = mathStore[Number(i)];

        try {
          return katex.renderToString(src, {
            throwOnError: false,
            displayMode: display
          });
        } catch (e) {
          return `<span class="katex-err">${esc(src)}</span>`;
        }
      });

      // Возвращаем code/диаграммы (снимаем обёртку <p>, которую мог добавить marked)
      html = html.replace(/<p>@@CODE_(\d+)@@<\/p>/g, (_, i) => codeStore[Number(i)]);
      html = html.replace(/@@CODE_(\d+)@@/g, (_, i) => codeStore[Number(i)]);

      return html;
    }

    // Запускает отрисовку Mermaid-диаграмм и навешивает обработчики (копирование кода, лайтбокс картинок)
    let mermaidReady=false;
    function initMermaidOnce(){
      if(mermaidReady||typeof mermaid==='undefined')return;
      const dark=document.documentElement.getAttribute('data-theme')==='dark'||
        (document.documentElement.getAttribute('data-theme')!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:dark?'dark':'default'});
      mermaidReady=true;
    }
    async function runNoteExtras(container){
      if(!container)return;
      bindNoteDiagrams(container);
      bindQuizzes(container);
      // диаграммы
      const nodes=container.querySelectorAll('.mermaid[data-mermaid-id]');
      if(nodes.length){
        initMermaidOnce();
        for(const node of nodes){
          const src=node.textContent;
          try{
            const {svg}=await mermaid.render(node.dataset.mermaidId+'-svg',src);
            node.innerHTML=svg;
          }catch(e){
            node.outerHTML=`<div class="mermaid-err">Не удалось построить диаграмму: ${esc(e.message||String(e))}</div>`;
          }
        }
      }
      // копирование кода
      container.querySelectorAll('[data-copy]').forEach(btn=>{
        btn.onclick=()=>{
          const code=btn.parentElement.querySelector('code');
          if(!code)return;
          navigator.clipboard.writeText(code.textContent).then(()=>{
            btn.textContent='Скопировано';btn.classList.add('copied');
            setTimeout(()=>{btn.textContent='Копировать';btn.classList.remove('copied');},1500);
          }).catch(()=>{});
        };
      });
      // лайтбокс для картинок конспекта
      container.querySelectorAll('img[data-lightbox]').forEach(img=>{
        img.onclick=()=>{
          const box=document.createElement('div');
          box.className='img-lightbox';
          box.innerHTML=`<img src="${esc(img.dataset.lightbox)}" alt="">`;
          box.onclick=()=>box.remove();
          document.body.appendChild(box);
        };
      });
    }

    /* ---------- собственный PDF-конвертер конспектов ---------- */
    /*
      Вместо нативной печати браузера (window.print → «Сохранить как PDF»),
      конспект вручную разбивается на страницы (с учётом «висячих» заголовков
      и максимального заполнения страницы), диаграммы превращаются в квадратные
      растровые картинки без исходной рамки, и результат собирается в настоящий
      PDF-файл через html2canvas + jsPDF, со своей подложкой-водяным знаком на
      каждой странице.
    */
    const PDF_MM = 96/25.4;                 // px на мм при 96dpi
    const PDF_PAGE_W_MM = 210, PDF_PAGE_H_MM = 297; // A4
    const PDF_MARGIN_MM = 14;               // отступ сверху/слева/справа — чтобы не печаталось «в край»
    const PDF_LOGO_W_MM = 24;               // ширина водяного знака (было ~18мм — чуть крупнее)
    const PDF_LOGO_LEFT_MM = 10;
    const PDF_LOGO_BOTTOM_MM = 8;
    const PDF_LOGO_GAP_MM = 6;              // зазор между текстом и логотипом, чтобы не перекрывались
    const PDF_MIN_TRAILING_PX = 86;         // ~3 строки текста (12pt/1.5) + отступ — порог для заголовков
    const PDF_CONTENT_W_MM = PDF_PAGE_W_MM - PDF_MARGIN_MM*2;
    const PDF_PAGE_W_PX = Math.round(PDF_CONTENT_W_MM*PDF_MM);
    const PDF_RENDER_SCALE = 2;             // разрешение растеризации страниц

    function pdfInjectStyleOnce(){
      if(document.getElementById('pdf-print-style'))return;
      const st=document.createElement('style');
      st.id='pdf-print-style';
      st.textContent=`
    #pdf-print-root{background:#ffffff;color:#111111;}
    #pdf-print-root h1{background:none;-webkit-text-fill-color:#111111;color:#111111;}
    #pdf-print-root .prose pre{background:#f4f4f7;color:#111111;border:1px solid #ddd;white-space:pre-wrap;word-break:break-word;}
    #pdf-print-root .prose :not(pre)>code{background:#eef0f7;color:#111111;}
    #pdf-print-root .mermaid{background:#ffffff;border-color:#ddd;}
    #pdf-print-root .prose a{color:#3730c9;text-decoration:underline;}
    #pdf-print-root .prose img{max-width:100%;}
    #pdf-print-root .heading-anchor,#pdf-print-root .code-copy{display:none !important;}
    #pdf-print-root .prose blockquote{border-left-color:#ccc;color:#555;}
    #pdf-print-root .prose table,#pdf-print-root .prose th,#pdf-print-root .prose td{border-color:#ccc;}
    #pdf-print-root .hljs-comment,#pdf-print-root .hljs-quote{color:#6a737d;}
    #pdf-print-root .hljs-keyword,#pdf-print-root .hljs-selector-tag,#pdf-print-root .hljs-subst{color:#a626a4;}
    #pdf-print-root .hljs-number,#pdf-print-root .hljs-literal,#pdf-print-root .hljs-variable,#pdf-print-root .hljs-template-variable,#pdf-print-root .hljs-tag .hljs-attr{color:#986801;}
    #pdf-print-root .hljs-string,#pdf-print-root .hljs-doctag{color:#50a14f;}
    #pdf-print-root .hljs-title,#pdf-print-root .hljs-section,#pdf-print-root .hljs-selector-id{color:#4078f2;}
    #pdf-print-root .hljs-type,#pdf-print-root .hljs-class .hljs-title{color:#c18401;}
    #pdf-print-root .hljs-tag,#pdf-print-root .hljs-name,#pdf-print-root .hljs-attribute{color:#e45649;}
    #pdf-print-root .hljs-regexp,#pdf-print-root .hljs-link{color:#50a14f;}
    #pdf-print-root .hljs-symbol,#pdf-print-root .hljs-bullet{color:#986801;}
    #pdf-print-root .hljs-built_in,#pdf-print-root .hljs-builtin-name{color:#4078f2;}
    #pdf-print-root .hljs-meta{color:#a0a1a7;}
    #pdf-print-root .hljs-deletion{background:#fdd;}
    #pdf-print-root .hljs-addition{background:#dfd;}
    #pdf-print-root .hljs-emphasis{font-style:italic;}
    #pdf-print-root .hljs-strong{font-weight:bold;}
    /* html2canvas ненадёжно рисует нативные маркеры списков (номер/буллит может
       наехать на текст) — поэтому в PDF отключаем list-style и рисуем маркер
       обычным текстовым span'ом с фиксированным отступом (см. pdfDelistify) */
    #pdf-print-root .prose ol,#pdf-print-root .prose ul{list-style:none;padding-left:0;}
    #pdf-print-root .prose li{position:relative;padding-left:1.7em;margin:.3em 0;}
    #pdf-print-root .prose .pdf-li-marker{position:absolute;left:0;top:0;min-width:1.3em;font-weight:600;}
    `;
      document.head.appendChild(st);
    }

    // Ждём загрузки картинок (обычных и уже превращённых диаграмм), чтобы верно измерить высоту
    function pdfWaitForImages(root){
      const imgs=Array.from(root.querySelectorAll('img'));
      return Promise.all(imgs.map(img=>{
        if(img.complete && img.naturalWidth>0)return Promise.resolve();
        return new Promise(res=>{
          const done=()=>{img.removeEventListener('load',done);img.removeEventListener('error',done);res();};
          img.addEventListener('load',done);img.addEventListener('error',done);
          setTimeout(res,8000);
        });
      }));
    }

    // Перед конвертацией в картинки — перерисовываем Mermaid-диаграммы заново в
    // принудительно светлой теме. Если конспект открыт в тёмной теме, исходная SVG
    // уже содержит «зашитые» тёмные (светлые на прозрачном фоне) цвета, которые на
    // белой странице PDF выглядят блёкло-серыми — почти чёрно-белыми. Перерендер
    // с нуля из исходного кода диаграммы (сохранён в data-mermaid-src) решает это.
    async function pdfForceLightMermaid(container){
      const nodes=Array.from(container.querySelectorAll('.mermaid[data-mermaid-src]'));
      if(!nodes.length || typeof mermaid==='undefined')return;
      let dark=false;
      try{
        dark=document.documentElement.getAttribute('data-theme')==='dark'||
          (document.documentElement.getAttribute('data-theme')!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      }catch(e){}
      try{
        mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'default'});
        for(const node of nodes){
          const src=node.dataset.mermaidSrc;
          if(!src)continue;
          try{
            const suffix='pdf-'+(node.dataset.mermaidId||Math.random().toString(36).slice(2));
            const {svg}=await mermaid.render(suffix+'-svg',src);
            node.innerHTML=svg;
          }catch(e){ /* не удалось перерендерить — оставляем то, что уже было отрисовано */ }
        }
      }finally{
        // возвращаем тему как было, чтобы не сломать диаграммы на живой странице
        try{mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:dark?'dark':'default'});}catch(e){}
      }
    }

    // Рендерит SVG (диаграмму) в квадратную растровую картинку на белой подложке
    function pdfSvgToSquareImage(svgEl){
      return new Promise((resolve,reject)=>{
        try{
          const clone=svgEl.cloneNode(true);
          const vb=clone.viewBox && clone.viewBox.baseVal;
          let w=(clone.width && clone.width.baseVal && clone.width.baseVal.value)||0;
          let h=(clone.height && clone.height.baseVal && clone.height.baseVal.value)||0;
          if((!w||!h) && vb && vb.width){w=vb.width;h=vb.height;}
          if(!w||!h){const bb=svgEl.getBoundingClientRect();w=bb.width||400;h=bb.height||300;}
          clone.setAttribute('width',w);clone.setAttribute('height',h);
          const xmlns='http://www.w3.org/2000/svg';
          const bg=document.createElementNS(xmlns,'rect');
          bg.setAttribute('x','0');bg.setAttribute('y','0');
          bg.setAttribute('width',String(w));bg.setAttribute('height',String(h));
          bg.setAttribute('fill','#ffffff');
          clone.insertBefore(bg,clone.firstChild);
          let xml=new XMLSerializer().serializeToString(clone);
          const cs=getComputedStyle(svgEl);
          xml=xml.replace(/var\((--[a-z0-9-]+)\)/gi,(_,name)=>cs.getPropertyValue(name).trim()||'#222222');
          const svg64=btoa(unescape(encodeURIComponent(xml)));
          const img=new Image();
          img.onload=()=>{
            const scale=2, side=Math.max(w,h);
            const canvas=document.createElement('canvas');
            canvas.width=Math.round(side*scale);canvas.height=Math.round(side*scale);
            const ctx=canvas.getContext('2d');
            ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.drawImage(img,(side-w)/2*scale,(side-h)/2*scale,w*scale,h*scale);
            resolve({dataUrl:canvas.toDataURL('image/png'), naturalW:w, naturalH:h});
          };
          img.onerror=()=>reject(new Error('svg render failed'));
          img.src='data:image/svg+xml;base64,'+svg64;
        }catch(e){reject(e);}
      });
    }

    // Подбирает конечный размер квадратной картинки: заметно меньше исходной
    // диаграммы, но не переусердствуя — иначе диаграмма становится нечитаемой
    function pdfDiagramTargetSize(naturalW,naturalH,budgetPx){
      const maxDim=Math.max(naturalW,naturalH,1);
      const capW=PDF_PAGE_W_PX*0.8;          // не шире 80% ширины страницы
      const capH=Math.max(budgetPx*0.75,180); // не выше 75% доступной высоты страницы
      const target=Math.min(maxDim*0.9,capW,capH);
      return Math.max(150,Math.round(target));
    }

    // Заменяет диаграммы (mermaid и любые другие svg-диаграммы) на квадратные
    // картинки меньшего размера, полностью убирая исходную рамку/фон/паддинги
    // контейнера — только сама картинка занимает место на странице
    // Проверяет, что цвет (строка вида "white"/"#fff"/"rgb(...)"), возвращённая
    // getComputedStyle, «почти белый» — т.е. на белом фоне PDF станет невидимым
    function pdfIsNearWhite(colorStr){
      if(!colorStr)return false;
      const s=colorStr.trim().toLowerCase();
      if(s==='white'||s==='#fff'||s==='#ffffff')return true;
      const m=/^rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/.exec(s);
      if(m){
        const r=+m[1],g=+m[2],b=+m[3];
        return r>235&&g>235&&b>235;
      }
      return false;
    }

    // Оси, деления и подписи графиков (например, xychart-beta) иногда получают
    // явный белый цвет прямо в коде диаграммы (рассчитанный на тёмный фон) — такой
    // цвет «зашит» в саму SVG и не перекрывается принудительной светлой темой из
    // pdfForceLightMermaid (та лечит только цвета, идущие из темы Mermaid). На
    // белой странице PDF это делает оси/подписи невидимыми. Подстраховка: находим
    // почти-белые обводки и подписи и перекрашиваем их в тёмно-серый — не трогая
    // заливки прочих фигур (чтобы не испортить легитимно белые области)
    function pdfFixWhiteOnWhite(svgEl){
      try{
        svgEl.querySelectorAll('path,line,polyline,circle,rect').forEach(el=>{
          const cs=window.getComputedStyle(el);
          if(cs.fill==='none'&&pdfIsNearWhite(cs.stroke))el.style.stroke='#333333';
        });
        svgEl.querySelectorAll('text,tspan').forEach(el=>{
          const cs=window.getComputedStyle(el);
          if(pdfIsNearWhite(cs.fill))el.style.fill='#333333';
          if(pdfIsNearWhite(cs.stroke))el.style.stroke='#333333';
        });
      }catch(e){ /* если не вышло — оставляем как есть, это лишь подстраховка */ }
    }

    async function pdfSquarifyDiagrams(container,budgetPx){
      await pdfForceLightMermaid(container);
      const svgs=Array.from(container.querySelectorAll('svg'));
      for(const svg of svgs){
        try{
          pdfFixWhiteOnWhite(svg);
          const {dataUrl,naturalW,naturalH}=await pdfSvgToSquareImage(svg);
          const targetPx=pdfDiagramTargetSize(naturalW,naturalH,budgetPx);
          const img=document.createElement('img');
          img.src=dataUrl;
          img.alt='diagram';
          img.style.cssText=`display:block;width:${targetPx}px;max-width:100%;height:auto;margin:0 auto;`;
          // полностью заменяем контейнер диаграммы (.mermaid/.diagram-figure/figure/…),
          // а не только его содержимое — иначе остаются рамка, паддинги и фон исходного блока
          const holder=svg.closest('.mermaid, .diagram-figure, figure')||svg.parentElement;
          const wrapper=document.createElement('div');
          wrapper.style.cssText='margin:10px auto;padding:0;border:none;background:none;text-align:center;';
          wrapper.appendChild(img);
          if(holder && holder.parentNode)holder.parentNode.replaceChild(wrapper,holder);
        }catch(e){ /* если не вышло — оставляем диаграмму как есть */ }
      }
    }

    // Заменяет нативную нумерацию/буллиты списков на обычный текстовый маркер
    // внутри каждого <li> — html2canvas не всегда корректно рисует native
    // list-style (маркер может наложиться на первую строку текста), а обычный
    // текст рисуется надёжно всегда
    function pdfDelistify(container){
      container.querySelectorAll('ol, ul').forEach(list=>{
        const ordered=list.tagName==='OL';
        const start=ordered?(parseInt(list.getAttribute('start')||'1',10)||1):null;
        let idx=0;
        Array.from(list.children).forEach(li=>{
          if(li.tagName!=='LI')return;
          const marker=document.createElement('span');
          marker.className='pdf-li-marker';
          marker.textContent=ordered?`${start+idx}.`:'•';
          li.insertBefore(marker,li.firstChild);
          idx++;
        });
      });
    }

    // Измеряет, насколько нижний край формулы отстоит от базовой линии строки
    // рядом с ней (сравнивая с контрольным символом-«соседом») — нужно, чтобы
    // после растрирования формулы в <img> сохранить её вертикальное положение
    // относительно окружающего текста
    function pdfMeasureBaselineOffset(el){
      const parent=el.parentNode;
      if(!parent)return 0;
      const ref=document.createTextNode('H');
      parent.insertBefore(ref,el);
      let offset=0;
      try{
        const range=document.createRange();
        range.selectNodeContents(ref);
        const refRect=range.getBoundingClientRect();
        const elRect=el.getBoundingClientRect();
        if(refRect.bottom&&elRect.bottom)offset=elRect.bottom-refRect.bottom;
      }catch(e){ /* если не вышло измерить — считаем смещение нулевым */ }
      parent.removeChild(ref);
      return offset;
    }

    // KaTeX рисует формулы сложной вложенной разметкой (стопки span'ов с
    // отрицательными отступами — т.н. vlist, нужны для дробей/степеней/индексов),
    // которую html2canvas регулярно рисует неверно — буквы и знаки съезжают и
    // накладываются друг на друга (в отличие от обычного текста). Поэтому, как и
    // диаграммы (см. pdfSquarifyDiagrams), формулы заранее растрируем в
    // картинку — html2canvas тогда просто копирует пиксели, без риска криво
    // уложить вложенную структуру KaTeX
    // html2canvas по умолчанию клонирует ВЕСЬ документ (и все страницы PDF в root) при каждом вызове.
    // ignoreElements оставляет в клоне только сам элемент, его предков и <head> со стилями.
    function pdfCapture(el,opts){
      const o=Object.assign({logging:false,useCORS:true},opts||{});
      // fullClone:true — обычный режим html2canvas (клонируется весь документ), без оптимизации
      if(!o.fullClone)o.ignoreElements=n=>!(n.closest('head')||n.contains(el)||el.contains(n));
      delete o.fullClone;
      return html2canvas(el,o);
    }
    // true, если на canvas нет ни одного непрозрачного пикселя (захват «пустой»)
    function pdfCanvasBlank(c){
      try{
        const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
        for(let i=3;i<d.length;i+=4)if(d[i])return false;
        return true;
      }catch(e){return false;}
    }

    async function pdfRasterizeMath(container,onProgress){
      const displays=Array.from(container.querySelectorAll('.katex-display'));
      const inline=Array.from(container.querySelectorAll('.katex')).filter(el=>!el.closest('.katex-display'));
      const targets=displays.map(el=>({el,display:true})).concat(inline.map(el=>({el,display:false})));

      // 1) все измерения одним пакетом: вставляем нулевые «якоря» на базовой линии,
      //    затем читаем layout один раз
      const wraps=targets.map(t=>{
        if(t.display||!t.el.parentNode)return null;
        const wrap=document.createElement('span');
        wrap.style.cssText='white-space:nowrap;';
        const probe=document.createElement('span');
        probe.style.cssText='display:inline-block;width:0;height:0;margin:0;padding:0;border:0;vertical-align:baseline;';
        t.el.parentNode.insertBefore(wrap,t.el);
        wrap.append(probe,t.el);
        return {wrap,probe};
      });
      const metrics=targets.map((t,i)=>{
        const rect=t.el.getBoundingClientRect();
        // расстояние от нижнего края формулы до базовой линии строки
        const offset=wraps[i]?rect.bottom-wraps[i].probe.getBoundingClientRect().bottom:0;
        return {rect,offset};
      });
      // возвращаем формулы на место и убираем временные обёртки
      wraps.forEach((w,i)=>{
        if(!w)return;
        w.wrap.parentNode.insertBefore(targets[i].el,w.wrap);
        w.wrap.remove();
      });

      // 2) растрируем
      let fast=true;
      for(let i=0;i<targets.length;i++){
        const {el,display}=targets[i], {rect,offset}=metrics[i];
        if(rect.width<1||rect.height<1)continue;
        if(onProgress)onProgress(i+1,targets.length);
        try{
          const capScale=PDF_RENDER_SCALE*1.5;
          let canvas=await pdfCapture(el,{backgroundColor:null,scale:capScale,fullClone:!fast});
          if(fast&&pdfCanvasBlank(canvas)){fast=false;canvas=await pdfCapture(el,{backgroundColor:null,scale:capScale,fullClone:true});}
          if(pdfCanvasBlank(canvas))continue; // не удалось отрисовать — оставляем формулу как есть, а не удаляем
          const img=document.createElement('img');
          img.src=canvas.toDataURL('image/png');
          img.alt='formula';
          const wpx=canvas.width/capScale, hpx=canvas.height/capScale;
          img.style.cssText=display
            ?`display:block;width:${wpx}px;height:${hpx}px;max-width:100%;margin:.4em auto;`
            :`display:inline-block;width:${wpx}px;height:${hpx}px;vertical-align:${-offset}px;`;
          if(el.parentNode)el.parentNode.replaceChild(img,el);
        }catch(e){ /* если конкретную формулу растрировать не вышло — оставляем как есть */ }
      }
    }

    function pdfCopyAttrs(from,to){
      if(from.id)to.id=from.id;
      if(from.className)to.className=from.className;
      if(from.hasAttribute && from.hasAttribute('start'))to.setAttribute('start',from.getAttribute('start'));
    }

    function pdfInlineIsSimple(el){
      return Array.from(el.childNodes).every(n=>n.nodeType===3||
        // IMG — сюда попадают в т.ч. растрированные формулы (см. pdfRasterizeMath);
        // они должны так же участвовать в обычной построчной упаковке абзаца
        ['STRONG','EM','B','I','CODE','A','SUP','SUB','SPAN','BR','ABBR','MARK','DEL','INS','IMG'].includes(n.tagName));
    }

    // Разбивает содержимое блока (текст + инлайн-теги) на «атомы»: слова остаются
    // словами, а форматированные фрагменты (ссылки, code, формулы) не рвутся внутри
    function pdfWordAtoms(el){
      const atoms=[];
      el.childNodes.forEach(node=>{
        if(node.nodeType===3){
          const parts=node.textContent.split(/(\s+)/).filter(s=>s!=='');
          parts.forEach(p=>atoms.push(document.createTextNode(p)));
        }else{
          atoms.push(node.cloneNode(true));
        }
      });
      return atoms;
    }

    function pdfIsHeadingTag(tag){return /^H[1-6]$/.test(tag);}
    function pdfIsSplittableTag(tag){return tag==='UL'||tag==='OL'||tag==='TABLE';}

    // ---- «упаковщик» страниц: работает с реальным DOM, измеряя высоту layout'ом ----
    function pdfCreatePacker(root){
      function newPageBuf(){
        const div=document.createElement('div');
        div.className='prose';
        div.style.width=PDF_PAGE_W_PX+'px';
        div.style.boxSizing='border-box';
        root.appendChild(div);
        return div;
      }
      const finished=[];
      let pageBuf=newPageBuf();
      const pageH=()=>pageBuf.scrollHeight;
      function startNewPage(){finished.push(pageBuf);pageBuf=newPageBuf();}
      function isEmpty(){return pageBuf.childNodes.length===0;}

      // измеряет, сколько места (в px) занял бы блок сам по себе на странице такой
      // же ширины — используется для «взгляда вперёд» после заголовка
      function measureStandalone(block){
        const probe=document.createElement('div');
        probe.className='prose';
        probe.style.cssText=`position:absolute;visibility:hidden;left:-99999px;top:0;width:${PDF_PAGE_W_PX}px;box-sizing:border-box;`;
        probe.appendChild(block.cloneNode(true));
        root.appendChild(probe);
        const h=probe.scrollHeight;
        root.removeChild(probe);
        return h;
      }

      // Заголовок (или несколько идущих подряд заголовков) вместе со следующим
      // содержательным блоком: заголовок переносится на следующую страницу, если
      // после него на текущей странице остаётся меньше ~3 строк содержимого —
      // либо потому, что осталось мало места, либо потому, что следующий блок
      // (диаграмма, таблица, картинка, код…) целиком не помещается и будет
      // перенесён на новую страницу сам по себе, оставив заголовок «висеть».
      function placeHeadingGroup(headings,nextBlock,maxPx){
        function appendHeadings(){return headings.map(h=>{const c=h.cloneNode(true);pageBuf.appendChild(c);return c;});}
        function removeNodes(nodes){nodes.forEach(n=>{if(n.parentNode)n.parentNode.removeChild(n);});}

        const startedEmpty=isEmpty();
        let nodes=appendHeadings();
        if(!startedEmpty && pageH()>maxPx){
          removeNodes(nodes);
          startNewPage();
          nodes=appendHeadings();
        }
        if(nextBlock){
          const pageHasOtherContent=pageBuf.childNodes.length>nodes.length;
          if(pageHasOtherContent){
            const remaining=maxPx-pageH();
            let insufficient;
            if((nextBlock.tagName==='P' && pdfInlineIsSimple(nextBlock))||pdfIsSplittableTag(nextBlock.tagName)){
              insufficient = remaining<PDF_MIN_TRAILING_PX;
            }else{
              // неразбиваемый блок (картинка/диаграмма/код/цитата и т.п.):
              // если целиком он поместится на свежей странице, но не в остаток
              // текущей — переносим заголовок вместе с ним
              const naturalH=measureStandalone(nextBlock);
              insufficient = naturalH<=maxPx && naturalH>remaining;
            }
            if(insufficient){
              removeNodes(nodes);
              startNewPage();
              appendHeadings();
            }
          }
        }
      }

      function placeAtomic(block,maxPx){
        const clone=block.cloneNode(true);
        if(isEmpty()){pageBuf.appendChild(clone);return;}
        pageBuf.appendChild(clone);
        if(pageH()<=maxPx)return;
        pageBuf.removeChild(clone);
        startNewPage();
        pageBuf.appendChild(block.cloneNode(true)); // если и на пустой странице не влезает — оставляем как есть
      }

      function placeInlineSplit(block,tag,maxPx){
        // быстрый путь: абзац целиком помещается на текущую страницу
        const whole=block.cloneNode(true);
        pageBuf.appendChild(whole);
        if(pageH()<=maxPx)return;
        pageBuf.removeChild(whole);

        const atoms=pdfWordAtoms(block);
        let i=0;
        while(i<atoms.length){
          const wrapper=document.createElement(tag);
          pdfCopyAttrs(block,wrapper);
          pageBuf.appendChild(wrapper);
          const fits=n=>{
            wrapper.replaceChildren(...atoms.slice(i,i+n).map(a=>a.cloneNode(true)));
            return pageH()<=maxPx;
          };
          // бинарный поиск: сколько «атомов» (слов) влезает на текущую страницу
          let lo=0, hi=atoms.length-i;
          if(fits(hi))lo=hi;
          else while(lo<hi){const mid=(lo+hi+1)>>1;if(fits(mid))lo=mid;else hi=mid-1;}

          if(lo===0){
            pageBuf.removeChild(wrapper);
            if(!isEmpty()){startNewPage();continue;}
            // пустая страница, но и одно слово не влезает — форсируем, чтобы не зациклиться
            pageBuf.appendChild(wrapper);
            lo=1;
          }
          fits(lo);
          i+=lo;
          if(i<atoms.length)startNewPage();
        }
      }

      function placeList(block,maxPx){
        const tag=block.tagName;
        const start=tag==='OL'?parseInt(block.getAttribute('start')||'1',10):null;
        let wrapper=null, idx=0;
        Array.from(block.children).forEach(li=>{
          if(li.tagName!=='LI')return;
          if(!wrapper){
            wrapper=document.createElement(tag);pdfCopyAttrs(block,wrapper);
            if(tag==='OL')wrapper.setAttribute('start',String(start+idx));
            pageBuf.appendChild(wrapper);
          }
          const liClone=li.cloneNode(true);
          wrapper.appendChild(liClone);
          if(pageH()>maxPx){
            wrapper.removeChild(liClone);
            if(wrapper.childNodes.length===0){
              wrapper.appendChild(liClone); // единственный li, и он больше страницы — оставляем как есть
            }else{
              startNewPage();
              wrapper=document.createElement(tag);pdfCopyAttrs(block,wrapper);
              if(tag==='OL')wrapper.setAttribute('start',String(start+idx));
              pageBuf.appendChild(wrapper);
              wrapper.appendChild(liClone);
            }
          }
          idx++;
        });
      }

      function placeTable(block,maxPx){
        const thead=block.querySelector(':scope > thead');
        let rows=Array.from(block.querySelectorAll(':scope > tbody > tr'));
        if(!rows.length)rows=Array.from(block.querySelectorAll('tr')).filter(tr=>!thead||!thead.contains(tr));
        if(!rows.length){placeAtomic(block,maxPx);return;}
        let wrapper=null, tbody=null;
        function open(){
          wrapper=document.createElement('table');pdfCopyAttrs(block,wrapper);
          if(thead)wrapper.appendChild(thead.cloneNode(true));
          tbody=document.createElement('tbody');
          wrapper.appendChild(tbody);
          pageBuf.appendChild(wrapper);
        }
        open();
        rows.forEach(tr=>{
          const rowClone=tr.cloneNode(true);
          tbody.appendChild(rowClone);
          if(pageH()>maxPx){
            tbody.removeChild(rowClone);
            if(tbody.childNodes.length===0){
              tbody.appendChild(rowClone);
            }else{
              startNewPage();
              open();
              tbody.appendChild(rowClone);
            }
          }
        });
      }

      function place(block,maxPx){
        try{
          const tag=block.tagName;
          if(pdfIsHeadingTag(tag))placeHeadingGroup([block],null,maxPx);
          else if(tag==='P' && pdfInlineIsSimple(block))placeInlineSplit(block,'P',maxPx);
          else if(tag==='UL'||tag==='OL')placeList(block,maxPx);
          else if(tag==='TABLE')placeTable(block,maxPx);
          else placeAtomic(block,maxPx);
        }catch(e){
          placeAtomic(block,maxPx);
        }
      }

      // Проходит по всем блокам верхнего уровня; заголовки (и идущие подряд серии
      // заголовков) обрабатываются вместе со следующим содержательным блоком, чтобы
      // не оставлять их «висящими» в конце страницы без материала под ними
      function packAll(blocks,maxPx){
        let i=0;
        while(i<blocks.length){
          const block=blocks[i];
          if(pdfIsHeadingTag(block.tagName)){
            const group=[block];
            let j=i+1;
            while(j<blocks.length && pdfIsHeadingTag(blocks[j].tagName)){group.push(blocks[j]);j++;}
            placeHeadingGroup(group,blocks[j],maxPx);
            i=j;
          }else{
            place(block,maxPx);
            i++;
          }
        }
      }

      return {
        place,
        packAll,
        finish(){finished.push(pageBuf);return finished;}
      };
    }

    async function pdfLoadLogo(){
      return new Promise(resolve=>{
        const img=new Image();
        img.onload=()=>{
          try{
            const canvas=document.createElement('canvas');
            canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
            canvas.getContext('2d').drawImage(img,0,0);
            resolve({dataUrl:canvas.toDataURL('image/png'), ratio:(img.naturalHeight/img.naturalWidth)||1});
          }catch(e){resolve(null);}
        };
        img.onerror=()=>resolve(null);
        img.src='img/logo.png';
      });
    }

    function pdfSanitizeFileName(s){
      return String(s).replace(/[\\/:*?"<>|]+/g,'_').trim()||'note';
    }

    async function generateNotePdf(fileName){
      const btn=document.getElementById('note-print-btn');
      const bodyEl=document.getElementById('note-body');
      if(!bodyEl)return;
      if(!window.jspdf || !window.html2canvas){
        alert('Не удалось загрузить библиотеки для генерации PDF. Проверьте подключение к интернету и обновите страницу.');
        return;
      }
      const origText=btn?btn.textContent:null;
      if(btn){btn.disabled=true;btn.textContent='Формирование PDF…';}
      let root=null;
      try{
        pdfInjectStyleOnce();
        const logo=await pdfLoadLogo();
        const logoHmm=logo?Math.max(6,Math.min(60,PDF_LOGO_W_MM*logo.ratio)):16;
        const bottomReserveMm=PDF_LOGO_BOTTOM_MM+logoHmm+PDF_LOGO_GAP_MM;
        const contentHmm=PDF_PAGE_H_MM-PDF_MARGIN_MM-bottomReserveMm;
        const pageHpx=Math.round(contentHmm*PDF_MM);

        // офф-экранный контейнер для измерения и рендера страниц (светлая тема, фиксированная ширина)
        root=document.createElement('div');
        root.id='pdf-print-root';
        Object.assign(root.style,{position:'fixed',left:'-10000px',top:'0',zIndex:'-1',background:'#ffffff'});
        root.style.setProperty('--bg','#ffffff');
        root.style.setProperty('--card','#ffffff');
        root.style.setProperty('--text','#111111');
        root.style.setProperty('--muted','#555555');
        root.style.setProperty('--border','#cccccc');
        root.style.setProperty('--accent','#5b5fef');
        root.style.setProperty('--accent2','#7c7ffb');
        root.style.fontFamily=getComputedStyle(document.body).fontFamily;
        document.body.appendChild(root);

        const source=bodyEl.cloneNode(true);
        source.removeAttribute('id');
        // картинки с loading="lazy" в скрытом контейнере не грузятся — из-за этого pdfWaitForImages ждал таймаут
        source.querySelectorAll('img').forEach(img=>{img.loading='eager';});
        source.querySelectorAll('[id]').forEach(el=>{ if(!el.closest('svg'))el.removeAttribute('id'); });
        source.style.cssText=`position:absolute;visibility:hidden;width:${PDF_PAGE_W_PX}px;box-sizing:border-box;`;
        // важно: подключаем клон к живому дереву документа (внутри root, уже
        // оформленного в светлой теме) ДО обработки диаграмм — иначе унаследованные
        // цвета/переменные темы не резолвятся у отсоединённого узла и рамка/цвета
        // диаграмм могут посчитаться неверно
        root.appendChild(source);
        source.querySelectorAll('.code-copy').forEach(b=>b.remove());
        // интерактивные массивы с кодом в PDF печатаются обычным статичным массивом (как раньше)
        printifyDiagrams(source);
        // тесты в PDF не выводим вообще — просто убираем из клона до вёрстки страниц
        source.querySelectorAll('[data-pdf-hide]').forEach(el=>el.remove());
        pdfDelistify(source);
        if(document.fonts && document.fonts.ready){try{await document.fonts.ready;}catch(e){}}
        source.style.visibility='visible';
        await pdfRasterizeMath(source,(i,n)=>{if(btn)btn.textContent=`Формулы ${i}/${n}…`;});
        if(btn)btn.textContent='Диаграммы…';
        await pdfSquarifyDiagrams(source,pageHpx);
        await pdfWaitForImages(source);

        const packer=pdfCreatePacker(root);
        packer.packAll(Array.from(source.children),pageHpx);
        root.removeChild(source);
        const pages=packer.finish().filter(p=>p.childNodes.length>0);
        if(!pages.length){alert('В конспекте нет содержимого для PDF.');return;}

        const {jsPDF}=window.jspdf;
        const pdf=new jsPDF({unit:'mm',format:'a4',compress:true});
        const maxContentPxAtScale=Math.round(pageHpx*PDF_RENDER_SCALE);
        for(let i=0;i<pages.length;i++){
          if(btn)btn.textContent=`Формирование PDF… ${i+1}/${pages.length}`;
          let canvas=await pdfCapture(pages[i],{backgroundColor:'#ffffff',scale:PDF_RENDER_SCALE});
          // подстраховка: если контент всё же перелился за расчётный бюджет высоты
          // (например, неразбиваемый блок крупнее целой страницы), обрезаем
          // картинку по высоте, чтобы она физически не могла залезть на область
          // водяного знака внизу страницы
          if(canvas.height>maxContentPxAtScale){
            const cropped=document.createElement('canvas');
            cropped.width=canvas.width;
            cropped.height=maxContentPxAtScale;
            cropped.getContext('2d').drawImage(canvas,0,0);
            canvas=cropped;
          }
          const imgWmm=PDF_CONTENT_W_MM;
          const imgHmm=imgWmm*canvas.height/canvas.width;
          const imgData=canvas.toDataURL('image/jpeg',0.93);
          if(i>0)pdf.addPage();
          pdf.addImage(imgData,'JPEG',PDF_MARGIN_MM,PDF_MARGIN_MM,imgWmm,imgHmm,undefined,'FAST');
          if(logo && logo.dataUrl){
            const y=PDF_PAGE_H_MM-PDF_LOGO_BOTTOM_MM-logoHmm;
            pdf.addImage(logo.dataUrl,'PNG',PDF_LOGO_LEFT_MM,y,PDF_LOGO_W_MM,logoHmm);
          }
        }
        pdf.setProperties({title:fileName});
        pdf.save(pdfSanitizeFileName(fileName.replace(/\.md$/i,''))+'.pdf');
      }catch(e){
        alert('Не удалось сформировать PDF: '+(e&&e.message?e.message:e));
      }finally{
        if(root && root.parentNode)root.parentNode.removeChild(root);
        if(btn){btn.disabled=false;btn.textContent=origText||'📄 Скачать PDF';}
      }
    }

    /* ---------- страница «Дедлайны» (встроена из отдельного раздела) ---------- */
    const DEADLINES_QUEUE_LABEL='queue-signup';
    const DAY_MS=86400000;
    function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
    // Единая логика статуса: сравниваем календарные дни, а не «округлённые сутки».
    function deadlineInfo(iso){
      const due=new Date(iso), now=new Date(), diff=due-now;
      const days=Math.round((dayStart(due)-dayStart(now))/DAY_MS);
      if(diff<=0){
        const ago=-days;
        return {state:'late',label:'Просрочен',short:ago>0?ago+' дн. назад':'сегодня'};
      }
      const label=days===0?'Сегодня':days===1?'Завтра':'Через '+days+' дн.';
      const h=diff/3600000;
      return {state:h<24?'urgent':h<72?'soon':'ok',label};
    }
    function validDeadlines(items){
      return (Array.isArray(items)?items:[]).filter(x=>x&&x.id&&x.name&&Number.isFinite(new Date(x.deadline).getTime()));
    }
    // Порядок: ближайшие впереди → затем просроченные (свежие выше) → затем выполненные.
    function orderDeadlines(items){
      const now=Date.now(), t=x=>new Date(x.deadline).getTime();
      const rank=x=>plan.done['deadline:'+x.id]?2:t(x)<=now?1:0;
      return validDeadlines(items).sort((a,b)=>rank(a)-rank(b)||(rank(a)===1?t(b)-t(a):t(a)-t(b)));
    }
    function deadlineBadge(iso){
      const info=deadlineInfo(iso);
      return `<span class="badge ${info.state}">${info.label}</span>`;
    }
    function fmtDeadlineFull(iso){return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}

    async function loadDeadlineQueues(){
      const url=`https://api.github.com/repos/${OWNER}/${REPO}/issues?labels=${DEADLINES_QUEUE_LABEL}&state=open&sort=created&direction=asc&per_page=100`;
      const res=await githubFetch(url);
      if(!res.ok){if(res.status===403)throw new Error('rate_limit');throw new Error('github_api');}
      const issues=await res.json();
      const bySubject={};
      issues.forEach(is=>{
        if(is.pull_request)return;
        const m=/^\[([^\]]+)\]\s*(.*)$/.exec(is.title||'');
        if(!m)return;
        const id=m[1].trim(), name=m[2].trim()||'(без имени)';
        (bySubject[id]=bySubject[id]||[]).push({name,url:is.html_url});
      });
      return bySubject;
    }
