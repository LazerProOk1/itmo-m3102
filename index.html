      const tasks=[...plan.tasks].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
      const visible=hideCompleted?tasks.filter(t=>!plan.done[t.id]):tasks;
      box.innerHTML=visible.length?visible.map(t=>`<div class="plan-row${plan.done[t.id]?' is-done':''}"><label><input type="checkbox" data-task="${esc(t.id)}" ${plan.done[t.id]?'checked':''}><span>${esc(t.name)}</span></label><span class="plan-date">${t.date?deadlineDate(t.date+'T12:00:00'):''}</span><button class="icon-button" data-delete="${esc(t.id)}" aria-label="Удалить задачу ${esc(t.name)}">×</button></div>`).join(''):'<p class="empty-line">Пока задач нет. Добавьте первую задачу.</p>';
    }
    function renderDeadlines(items){
      const box=document.getElementById('home-deadlines');if(!box)return;
      const isDone=x=>Boolean(plan.done['deadline:'+x.id]);
      const visible=orderDeadlines(items).filter(x=>!isDone(x)).slice(0,3);
      box.innerHTML=visible.length?visible.map(d=>{
        const late=deadlineInfo(d.deadline).state==='late';
        return `<label class="deadline-row${late?' is-late':''}"><input type="checkbox" data-deadline="${esc(d.id)}" aria-label="Отметить ${esc(d.name)} выполненным"><span class="deadline-day">${deadlineDate(d.deadline)}</span><span class="deadline-detail"><strong>${esc(d.name)}</strong><small>${esc(d.note||'Общий дедлайн')}</small></span><span class="deadline-status">${deadlineStatus(d.deadline)}</span></label>`;
      }).join(''):'<p class="empty-line">Все ближайшие дедлайны отмечены как выполненные.</p>';
      const completed=validDeadlines(items).filter(isDone).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
      const doneBox=document.getElementById('completed-deadlines');
      if(doneBox)doneBox.innerHTML=completed.length?`<details><summary>Выполненные дедлайны · ${completed.length}</summary>${completed.map(d=>`<label class="completed-row"><input type="checkbox" data-deadline="${esc(d.id)}" checked><span>${esc(d.name)}</span></label>`).join('')}</details>`:'';
    }
    let homeDeadlineItems=[];
    async function loadHomeDeadlines(){
      try{
        const response=await fetch('./Дедлайны/deadlines.json',{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        homeDeadlineItems=await response.json();
        if(!Array.isArray(homeDeadlineItems))throw new Error('Неверный формат');
        renderDeadlines(homeDeadlineItems);
      }catch(e){const box=document.getElementById('home-deadlines');if(box)box.innerHTML='<p class="empty-line">Не удалось загрузить сроки. <a href="#/deadlines">Открыть раздел дедлайнов</a></p>';}
    }
    // Заголовок главной берётся из js/greetings.js; одиночная точка в конце сохраняет акцентный цвет
    function greetingHtml(){
      const text=pickGreeting(), m=/^(.*[^.])\.$/.exec(text);
      return m?`${esc(m[1])}<span class="hero-period">.</span>`:esc(text);
    }
    // Подпись под датой: чётность недели / каникулы (или причина, почему расписания нет)
    function scheduleLabel(now){
      const schedule=getSchedule();
      if(!schedule)return 'Расписание загружается';
      return isVacation(now,schedule)?'Каникулы':weekParity(now,schedule)==='even'?'Чётная неделя':'Нечётная неделя';
    }
    function renderHome(){
      const c=document.getElementById('content');
      const now=new Date();
      const tiles=HOME_TILES.map(t=>`<a class="material-link" href="#/${encodePath(t.name)}" data-nav="${esc(t.name)}"><span class="material-icon">${t.icon}</span><strong>${esc(t.name)}</strong><small>${esc(t.desc)}</small><span class="material-arrow" aria-hidden="true">↗</span></a>`).join('');
      c.innerHTML=`
      <section class="home-hero"><div class="hero-inner"><div><h1>${greetingHtml()}</h1><p class="sub">Всё важное для группы М3102 — в одном месте.</p></div><div class="hero-date"><strong>${now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</strong><span class="hero-week">${scheduleLabel(now)}</span></div></div><span class="hero-orbit" aria-hidden="true"></span><span class="hero-hedgehog" aria-hidden="true">🦔</span></section>
      <div class="dashboard-grid">
        <section class="dash-panel schedule-panel"><div class="panel-head"><h2>Сегодня в расписании</h2><a href="#/schedule">Все занятия <span aria-hidden="true">↗</span></a></div>${homeSchedule()}</section>
        <section class="dash-panel deadline-panel"><div class="panel-head"><h2>Ближайшие дедлайны</h2><a href="#/deadlines">Все дедлайны <span aria-hidden="true">↗</span></a></div><div id="home-deadlines"><p class="empty-line">Загрузка сроков…</p></div><div id="completed-deadlines"></div></section>
        <section class="dash-panel homework-panel"><div class="panel-head"><h2>Домашнее задание</h2><a href="#/homework">Все задания <span aria-hidden="true">↗</span></a></div><div id="home-homework"><p class="empty-line">Загрузка заданий…</p></div></section>
        <section class="dash-panel materials-panel"><div class="panel-head"><h2>Материалы</h2><a href="#/materials">Все материалы <span aria-hidden="true">↗</span></a></div><div class="material-links">${tiles}</div></section>
        <section class="dash-panel plan-panel"><div class="panel-head"><h2>Мой учебный план</h2><label class="toggle-label"><input id="hide-completed" type="checkbox" ${hideCompleted?'checked':''}> Скрыть выполненные</label></div><form id="plan-form" class="plan-form"><input id="task-name" name="name" type="text" maxlength="120" placeholder="Добавить свою задачу…" aria-label="Новая задача" required><input id="task-date" name="date" type="date" aria-label="Срок задачи"><button type="submit">Добавить</button></form><div id="plan-list"></div><p class="plan-hint">Личные задачи и отметки хранятся в этом браузере.</p></section>
        <section class="dash-panel notes-panel"><div class="panel-head"><h2>Недавние конспекты</h2><a href="#/${encodePath('Конспекты')}">Все конспекты <span aria-hidden="true">↗</span></a></div><div id="recent-notes"><p class="empty-line">Загрузка конспектов…</p></div></section>
      </div>`;
      c.querySelectorAll('[data-nav]').forEach(el=>el.onclick=e=>{e.preventDefault();goto(el.dataset.nav);});
      document.getElementById('plan-form').onsubmit=e=>{
        e.preventDefault();
        const name=document.getElementById('task-name').value.trim();
        if(!name)return;
        plan.tasks.push({id:crypto.randomUUID(),name,date:document.getElementById('task-date').value});
        savePlan();renderPlan();e.target.reset();document.getElementById('task-name').focus();
      };
      c.onchange=e=>{
        if(e.target.id==='hide-completed'){hideCompleted=e.target.checked;renderPlan();}
        if(e.target.dataset.task){plan.done[e.target.dataset.task]=e.target.checked;savePlan();renderPlan();}
        if(e.target.dataset.deadline){plan.done['deadline:'+e.target.dataset.deadline]=e.target.checked;savePlan();renderDeadlines(homeDeadlineItems);}
      };
      c.onclick=e=>{
        const button=e.target.closest('[data-delete]');if(!button)return;
        plan.tasks=plan.tasks.filter(t=>t.id!==button.dataset.delete);
        delete plan.done[button.dataset.delete];savePlan();renderPlan();
      };
      renderPlan();
      loadHomeDeadlines();
      renderHomeHomework();
      fetchRecentNotes();
      ensureSchedule().then(()=>{
        // раньше после загрузки обновлялась только панель расписания, а подпись под датой навсегда оставалась «загружается»
        const week=c.querySelector('.hero-week');if(week)week.textContent=scheduleLabel(new Date());
        const box=c.querySelector('.schedule-panel');if(box){const old=box.querySelector('.today-list,.empty-line');if(old)old.outerHTML=homeSchedule();}
      }).catch(()=>{
        const week=c.querySelector('.hero-week');if(week)week.textContent='Расписание недоступно';
        const old=c.querySelector('.schedule-panel .empty-line');if(old)old.textContent='Не удалось загрузить расписание. Обновите страницу.';
      });
    }
    const RECENT_NOTES_LIMIT=6;
    async function fetchRecentNotes(){
      const box=document.getElementById('recent-notes');
      if(!box)return;
      try{
        const res=await githubFetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits?sha=${BRANCH}&path=${encodeURIComponent('Конспекты')}&per_page=10`);
        if(!res.ok)throw new Error('HTTP '+res.status);
        const commits=await res.json();
        const seen=new Map();
        for(const cm of commits){
          if(seen.size>=RECENT_NOTES_LIMIT)break;
          try{
            const cr=await githubFetch(`https://api.github.com/repos/${OWNER}/${REPO}/commits/${cm.sha}`);
            if(!cr.ok)continue;
            const detail=await cr.json();
            const date=(cm.commit&&cm.commit.author&&cm.commit.author.date)||(detail.commit&&detail.commit.author&&detail.commit.author.date);
            (detail.files||[]).forEach(f=>{
              if(ext(f.filename)==='md'&&f.status!=='removed'&&!seen.has(f.filename)&&!isHiddenPath(f.filename))seen.set(f.filename,date);
            });
          }catch(e){/* пропускаем коммит при ошибке */}
        }
        const list=Array.from(seen.entries()).map(([path,date])=>({path,date})).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,RECENT_NOTES_LIMIT);
        if(list.length===0){box.innerHTML='<p class="state" style="padding:8px 0;">Пока нет добавленных конспектов.</p>';return;}
        await loadDisplayNames();
        box.innerHTML=list.map(item=>{
          const parts=item.path.split('/');
          const name=stripExt(prettyName(item.path,parts[parts.length-1])).trim();
          let subject='Прочее';
          if(parts[0]==='Конспекты'&&parts.length>=2)subject=prettyName(parts.slice(0,2).join('/'),parts[1]);
          else if(parts.length>=2)subject=prettyName(parts.slice(0,-1).join('/'),parts[parts.length-2]);
          const dateStr=new Date(item.date).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'});
          return`<a class="recent-item" data-note="${esc(item.path)}"><div class="recent-name">${esc(name)}</div><div class="recent-meta">${esc(subject)} · ${dateStr}</div></a>`;
        }).join('');
        box.querySelectorAll('[data-note]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoNote(el.dataset.note);});
      }catch(e){
        box.innerHTML='<p class="state" style="padding:8px 0;">Не удалось загрузить список (превышен лимит запросов к GitHub API?).</p>';
      }
    }

    /* ---------- routing ---------- */
    function parseHash(){
      let h=location.hash.replace(/^#\/?/,'');
      if(h==='')return{mode:'home',path:''};
      if(h==='materials')return{mode:'browse',path:''};
      if(h==='schedule')return{mode:'schedule',path:''};
      if(h==='homework')return{mode:'homework',path:''};
      if(h==='hw-deadlines')return{mode:'hw-deadlines',path:''};
      if(h==='deadlines')return{mode:'deadlines',path:''};
      if(h==='diagrams'||h.startsWith('diagrams?'))return{mode:'diagrams',path:''};
      if(h==='memes')return{mode:'memes',path:''};
      if(h==='links')return{mode:'links',path:''};
      if(h==='students')return{mode:'students',path:''};
      if(h==='other')return{mode:'other',path:''};
      if(/^schedule\/\d{4}-\d{2}-\d{2}$/.test(h))return{mode:'schedule',path:h.slice(9)};
      if(h.startsWith('view/'))return{mode:'view',path:decodePath(h.slice(5))};
      if(h.startsWith('note/'))return{mode:'note',path:decodePath(h.slice(5))};
      return{mode:'browse',path:decodePath(h)};
    }
    function updateActiveTab(mode,path){
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      let id='tab-materials';
      if(mode==='home')id='tab-home';
      else if(mode==='schedule')id='tab-schedule';
      else if(mode==='homework'||mode==='hw-deadlines'||mode==='deadlines')id='tab-homework';
      else if(mode==='students')id='tab-students';
      else if(mode==='diagrams'||mode==='memes'||mode==='other')id='tab-other';
      const el=document.getElementById(id);
      if(el)el.classList.add('active');
    }
    function breadcrumbs(path){
      const parts=path?path.split('/'):[];
      let html='<div class="crumbs"><a data-p="">Материалы</a>';
      let acc='';
      parts.forEach(p=>{acc=acc?acc+'/'+p:p;html+=' / <a data-p="'+esc(acc)+'">'+esc(prettyName(acc,p))+'</a>';});
      return html+'</div>';
    }
    function viewBar(icon,name,path,extra=''){
      return `<div class="viewbar"><button class="btn2" id="back-btn">← Назад</button><div class="viewname">${icon} ${esc(name)}</div>${extra}<a class="btn2" href="${rawUrl(path)}" target="_blank" rel="noopener" download>Скачать</a></div>`;
    }
    function bindBack(path){document.getElementById('back-btn').onclick=()=>goto(path.split('/').slice(0,-1).join('/'));}
    const stripExt=n=>n.replace(/\.[^.]+$/,'');
    const PILL_SKIP=new Set(); // например new Set(['md']), чтобы не показывать плашку у конспектов
    let routeSeq=0; // номер текущего перехода: поздние ответы старых страниц игнорируются
    async function renderBrowse(path){
      const seq=routeSeq;
      const c=document.getElementById('content');
      let intro='';
      if(!path)intro='<div class="intro"><h1>Материалы группы М3102</h1><p class="sub">Конспекты, записи лекций, лабораторные и учебники по дисциплинам первого курса ИТМО. Выберите раздел, затем — предмет и нужный файл. PDF и конспекты .md открываются прямо в браузере.</p></div>'+materialsSwitch('files');
      c.innerHTML=intro+breadcrumbs(path)+'<p class="state">Загрузка…</p>';
      try{
        const [res]=await Promise.all([githubFetch(apiUrl(path)),loadDisplayNames()]);
        if(seq!==routeSeq)return;
        if(!res.ok){
          if(res.status===404){const moved=await findMoved(path);if(seq!==routeSeq)return;if(moved){location.replace('#/'+encodePath(moved));return;}}
          const msg=res.status===403?'Превышен лимит запросов к GitHub API. Подождите немного и обновите страницу.':'Не удалось загрузить содержимое папки.';
          c.innerHTML=intro+breadcrumbs(path)+'<p class="state">'+msg+'</p>';return;
        }
        let items=await res.json();
        if(seq!==routeSeq)return;
        if(!Array.isArray(items))items=[items];
        items=items.filter(it=>!isHiddenPath(it.path));
        const shown=it=>it.type==='dir'?prettyName(it.path,it.name):stripExt(prettyName(it.path,it.name));
        items.sort((a,b)=>a.type!==b.type?(a.type==='dir'?-1:1):byLecture({name:shown(a)},{name:shown(b)}));
        let grid='<div class="grid">';
        items.forEach(it=>{
          if(it.type==='dir'){
            if(!path && it.name==='Дедлайны'){
              grid+=`<a class="card deadline-card" href="#/deadlines"><div class="ic">ДД</div><div class="meta"><div class="name">Дедлайны</div><div class="desc">Сроки сдачи и важные даты</div></div></a>`;
              return;
            }
            const sub=path?'':(SUBTITLES[it.name]||'Папка');
            grid+=`<a class="card" data-nav="${esc(it.path)}"><div class="ic">↗</div><div class="meta"><div class="name">${esc(shown(it))}</div><div class="desc">${esc(sub)}</div></div></a>`;
          }else{
            const e=ext(it.name);
            if(it.name==='index.html')return;
            const pill=PILL_SKIP.has(e)?'':`<span class="fmt-pill">${esc(EXT_ICON[e]||e.toUpperCase()||'ФАЙЛ')}</span>`;
            const title=`${esc(shown(it))}${pill}`;
            if(e==='pdf'){
              grid+=`<a class="card" data-view="${esc(it.path)}"><div class="ic">▤</div><div class="meta"><div class="name">${title}</div><div class="desc">${fmtSize(it.size)} · читать в браузере</div></div></a>`;
            }else if(e==='md'){
              grid+=`<a class="card" data-note="${esc(it.path)}"><div class="ic">▤</div><div class="meta"><div class="name">${title}</div><div class="desc">${fmtSize(it.size)} · читать конспект</div></div></a>`;
            }else{
              grid+=`<div class="card" style="cursor:default;"><div class="ic">▤</div><div class="meta"><div class="name">${title}</div><div class="desc">${fmtSize(it.size)}</div></div><a class="btn" href="${rawUrl(it.path)}" target="_blank" rel="noopener">Скачать</a></div>`;
            }
          }
        });
        grid+='</div>';
        if(items.length===0)grid='<p class="state">Папка пуста.</p>';
        c.innerHTML=intro+breadcrumbs(path)+grid;
        c.querySelectorAll('[data-nav]').forEach(el=>el.onclick=e=>{e.preventDefault();goto(el.dataset.nav);});
        c.querySelectorAll('[data-view]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoView(el.dataset.view);});
        c.querySelectorAll('[data-note]').forEach(el=>el.onclick=e=>{e.preventDefault();gotoNote(el.dataset.note);});
        c.querySelectorAll('.crumbs a').forEach(el=>el.onclick=e=>{e.preventDefault();goto(el.dataset.p);});
      }catch(e){
        if(seq!==routeSeq)return;
        c.innerHTML=intro+breadcrumbs(path)+'<p class="state">Ошибка загрузки: '+esc(e.message)+'</p>';
      }
    }

    function renderPdfView(path){
      const seq=routeSeq;
      const name=prettyName(path,path.split('/').pop());
      const c=document.getElementById('content');
      c.innerHTML=`<div class="note-layout"><div class="note-main">${viewBar('PDF',name,path)}<p class="state" id="pdf-status">Загрузка PDF…</p><div id="pdf-pages" style="max-width:900px;margin:0 auto;"></div></div><div class="note-side-host" id="note-side"></div></div>`;
      loadDisplayNames().then(()=>{const v=document.querySelector('.viewname');if(v)v.textContent='PDF '+stripExt(prettyName(path,name));});
      bindBack(path);
      mountSidebar(document.getElementById('note-side'),path,{toc:false});
      if(!window.__pdfWorkerSet){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';window.__pdfWorkerSet=true;}
      pdfjsLib.getDocument(rawUrl(path)).promise.then(pdf=>{
        if(seq!==routeSeq)return;
        const status=document.getElementById('pdf-status');if(status)status.remove();
        const container=document.getElementById('pdf-pages');
        for(let n=1;n<=pdf.numPages;n++){
          const canvas=document.createElement('canvas');
          canvas.className='pdf-page';
          container.appendChild(canvas);
          pdf.getPage(n).then(page=>{
            const cw=Math.min(container.clientWidth||860,900);
            const vp0=page.getViewport({scale:1});
            const viewport=page.getViewport({scale:cw/vp0.width});
            canvas.width=viewport.width;canvas.height=viewport.height;
            page.render({canvasContext:canvas.getContext('2d'),viewport});
          });
        }
      }).catch(err=>{
      if(seq!==routeSeq)return;
      findMoved(path).then(moved=>{
        if(seq!==routeSeq)return;
        if(moved){location.replace('#/view/'+encodePath(moved));return;}
        const status=document.getElementById('pdf-status');
        if(status)status.textContent='Не удалось загрузить PDF ('+err.message+'). Попробуйте скачать файл напрямую.';
      });
    });
    }

    function renderNoteView(path){
      const seq=routeSeq;
      const name=prettyName(path,path.split('/').pop());
      const c=document.getElementById('content');
      c.innerHTML=`<div class="note-layout"><div class="note-main">${viewBar('MD',name,path,'<button class="btn2" id="note-print-btn" type="button">📄 Скачать PDF</button>')}<p class="state" id="note-status">Загрузка…</p><div class="prose" id="note-body"></div></div><div class="note-side-host" id="note-side"></div></div>`;
      bindBack(path);
      const side=mountSidebar(document.getElementById('note-side'),path,{toc:true});
      document.getElementById('note-print-btn').onclick=()=>{generateNotePdf(prettyName(path,name));};
      loadDisplayNames().then(()=>{const v=document.querySelector('.viewname');if(v)v.textContent='MD '+stripExt(prettyName(path,name));});
      fetch(rawUrl(path)).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
        .then(text=>{
          if(seq!==routeSeq)return;
          const quizSrc=quizPageSource(text);
          if(quizSrc!==null){
            // файл начинается с «mode: quiz» — показываем тест на всю страницу вместо конспекта
            c.innerHTML=`<div class="quiz-page">${viewBar('MD',name,path)}<div id="quiz-root"></div></div>`;
            bindBack(path);
            mountQuizPage(document.getElementById('quiz-root'),quizSrc);
            return;
          }
          const s=document.getElementById('note-status');if(s)s.remove();
          const body=document.getElementById('note-body');
          body.innerHTML=renderNotes(stripFrontMatter(text),path);
          runNoteExtras(body);
          side.setBody(body);
        })
        .catch(err=>{
      if(seq!==routeSeq)return;
      findMoved(path).then(moved=>{
        if(seq!==routeSeq)return;
        if(moved){location.replace('#/note/'+encodePath(moved));return;}
        const s=document.getElementById('note-status');if(s)s.textContent='Не удалось загрузить файл ('+err.message+').';
      });
    });
    }

    function route(){
      routeSeq++;
      const {mode,path}=parseHash();
      updateActiveTab(mode,path);
      if(mode==='view')renderPdfView(path);
      else if(mode==='note')renderNoteView(path);
      else if(mode==='home')renderHome();
      else if(mode==='schedule')mountSchedule(parseDate(path)||new Date());
      else if(mode==='homework')renderHomeworkPage();
      else if(mode==='hw-deadlines')renderHwDeadlinesPage();
      else if(mode==='deadlines')renderDeadlinesPage();
      else if(mode==='diagrams')renderDiagramEditor();
      else if(mode==='memes')renderMemesPage();
      else if(mode==='links')renderLinksPage();
      else if(mode==='students')renderStudentsPage();
      else if(mode==='other')renderOtherPage();
      else renderBrowse(path);
    }
    window.addEventListener('hashchange',route);
    // Клик по ссылке на уже открытый адрес не вызывает hashchange — перерисовываем страницу вручную
    document.addEventListener('click',e=>{
      if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
      const a=e.target.closest('a[href^="#/"]');
      if(a&&!a.closest('.ss-results')&&a.getAttribute('href')===location.hash){e.preventDefault();route();}
    });
    installScheduleEditor();
    installHomework();
    installDiagramEditor();
    installMemes();
    mountSiteSearch(document.getElementById('site-search'));
    route();
    </script>
    </body>
    </html>
