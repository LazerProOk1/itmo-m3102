name: Синхронизировать master с RedstoneLord

# master в этом форке — legacy: точная копия RedstoneLord/itmo-m3102 (их старый статический сайт).
# Кнопка «Run workflow» во вкладке Actions или раз в сутки — подтягивает их master сюда.
# Ветки react-app и react-app-dev не трогает.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Подтянуть master из RedstoneLord/itmo-m3102
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=master \
            --jq '"\(.merge_type): \(.message)"'
