name: Deploy to GitHub Pages

on:
  push:
    branches: [react-app]
  workflow_dispatch:
  # Раз в сутки (05:00 МСК) — пересобрать календарь-подписку m3102.ics, даже если в коде ничего не менялось:
  # у группы меняются расписание, дедлайны и ДЗ
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Проект сайта — в app/, в корне репозитория лежит классический сайт группы и документация
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Классический сайт группы (из корня репозитория) → app/public/classic, с самыми свежими data/ и Дедлайны/;
      # не получилось взять свежие — остаются закоммиченные (scripts/assemble-classic.ts)
      - run: npm run classic -- --fresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Календарь-подписка для Google и Apple Календаря (scripts/build-ics.ts)
      - run: npm run ics
      # Бюджет размера сборки (scripts/check-size.mjs)
      - run: npm run size
      # Автотесты в браузере по собранному сайту (e2e/); упали — трассы в артефакте e2e-traces
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: app/test-results
      # Lighthouse по собранному сайту (lighthouserc.json): доступность, практики и сдвиг вёрстки — порог,
      # производительность — только предупреждение (эмуляция слабого телефона шумит). Отчёт — в артефакте
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: app/lighthouse-report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
