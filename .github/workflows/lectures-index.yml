name: Обновить индекс лекций

on:
  push:
    branches: [master]
    paths:
      - 'Конспекты/**'
      - 'tools/build-lectures-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-lectures-index.mjs
      - name: Закоммитить, если индекс изменился
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lectures.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновить индекс лекций"
          git push
