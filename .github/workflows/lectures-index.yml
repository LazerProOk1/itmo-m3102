name: Обновить индекс лекций

# Индекс лекций теперь пересобирается в normalize-names.yml (вместе с переименованием
# и поисковым индексом), чтобы параллельные запуски не конфликтовали при push.
# Этот workflow оставлен только для ручного запуска.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-lectures-index.mjs
      - name: Закоммитить, если индекс изменился
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lectures.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Обновить индекс лекций"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            git rebase --abort || true
          done
          exit 1
